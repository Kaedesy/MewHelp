<!doctype html>
<!-- 人工复核问题对归并关系的页面；用于确认、驳回或标记待判断关系。 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flywheel Pair Review</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 1100px; margin: 28px auto; padding: 0 18px; color:#20242a; }
    .toolbar, .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .pair { border:1px solid #ddd; border-radius:10px; padding:16px; margin:14px 0; }
    .questions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
    .question { background:#f6f7f8; padding:12px; border-radius:8px; }
    button { cursor:pointer; padding:7px 12px; }
    .muted { color:#667085; font-size:13px; }
    .metrics { background:#eef5ff; border-radius:8px; padding:12px; margin:14px 0; }
    #message { color:#a22; }
    @media(max-width:700px){.questions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Flywheel case-pair review</h1>
  <p>Review the model's original pair proposal. Your final label is stored separately for evaluation.</p>
  <div class="toolbar">
    <label>Reviewer ID <input id="reviewer" maxlength="128" placeholder="e.g. wxz"></label>
    <label>Filter <select id="status"><option value="unreviewed">No human final label</option><option value="all">All</option><option value="confirmed">Proposal accepted</option><option value="rejected">Proposal overturned</option></select></label>
    <button id="reload">Refresh</button>
    <a href="/review">Knowledge review queue</a>
  </div>
  <div id="metrics" class="metrics">Loading audit metrics?</div>
  <div id="message" role="status"></div>
  <section id="items"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("reviewer").value = localStorage.getItem("flywheelReviewer") || "";
$("reviewer").addEventListener("change", () => localStorage.setItem("flywheelReviewer", $("reviewer").value.trim()));
async function api(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || response.statusText);
  return data;
}
async function refreshMetrics() {
  const m = await api("/api/review/flywheel/pairs/metrics");
  const pct = (v) => v == null ? "?" : `${(100*v).toFixed(1)}%`;
  $("metrics").textContent = `Human-reviewed ${m.audited_pair_count}/${m.total_recorded_pairs} recorded pairs ? coverage ${pct(m.human_review_coverage)} ? override rate ${pct(m.human_override_rate)} ? merge precision ${m.merge_precision == null ? "?" : m.merge_precision.toFixed(3)} ? merge recall ${m.merge_recall == null ? "?" : m.merge_recall.toFixed(3)} ? model abstentions ${m.model_abstention_count} ? final uncertain ${m.final_uncertain_count}. Reviewed-sample metrics only.`;
}
async function load() {
  $("message").textContent = "";
  try {
    await refreshMetrics();
    const status = $("status").value;
    const data = await api(`/api/review/flywheel/pairs?limit=200${status === "all" ? "" : `&status=${encodeURIComponent(status)}`}`);
    $("items").innerHTML = data.items.map(item => `<article class="pair" data-id="${escapeHtml(item.relation_id)}">
      <div><b>Proposal:</b> ${escapeHtml(item.relation_proposed)} ? <b>Review status:</b> ${escapeHtml(item.review_status)} <span class="muted">(${escapeHtml(item.case_id_a)} / ${escapeHtml(item.case_id_b)})</span></div>
      <div class="questions"><div class="question"><b>Case A</b><br>${escapeHtml(item.question_a || "Source text unavailable")}</div><div class="question"><b>Case B</b><br>${escapeHtml(item.question_b || "Source text unavailable")}</div></div>
      <div><b>Model rationale:</b> ${escapeHtml(item.rationale)}</div>
      ${item.relation_final ? `<p><b>Final relation:</b> ${escapeHtml(item.relation_final)}</p>` : ""}
      <div class="actions"><button data-decision="merge">Confirm merge</button><button data-decision="no_merge">Confirm no merge</button><button data-decision="uncertain">Cannot determine</button></div>
    </article>`).join("") || "<p>No pairs match this filter.</p>";
  } catch (err) { $("message").textContent = `Load failed: ${err.message}`; }
}
$("items").addEventListener("click", async (event) => {
  const decision = event.target.dataset.decision;
  if (!decision) return;
  const reviewer_id = $("reviewer").value.trim();
  if (!reviewer_id) { $("message").textContent = "Enter reviewer ID first."; return; }
  const card = event.target.closest("article");
  const comment = prompt("Review rationale (optional):") || "";
  try {
    await api(`/api/review/flywheel/pairs/${encodeURIComponent(card.dataset.id)}/review`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({decision, reviewer_id, comment})
    });
    await load();
  } catch (err) { $("message").textContent = `Submit failed: ${err.message}`; }
});
$("reload").addEventListener("click", load);
$("status").addEventListener("change", load);
load();
</script>
</body>
</html>
